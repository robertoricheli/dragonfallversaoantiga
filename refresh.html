<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Atualizando Dragonfall…</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#120808;color:#ffd86b;font-family:system-ui,sans-serif;text-align:center;padding:24px}</style>
</head><body><div><h1>Atualizando o jogo…</h1><p>Atualizando runtime (artes e vídeos já baixados são mantidos).</p></div>
<script>
(function(){try{
  var MEDIA="dragonfall-media";
  function keepMedia(name){return name===MEDIA;}
  var c=Promise.resolve();
  if(navigator.serviceWorker)c=c.then(function(){return navigator.serviceWorker.getRegistrations();})
    .then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));});
  if(window.caches)c=c.then(function(){return caches.keys();})
    .then(function(ks){return Promise.all(ks.filter(function(k){return !keepMedia(k);}).map(function(k){return caches.delete(k);}));});
  c.then(function(){
    try{localStorage.removeItem("df_pwa_build_v");localStorage.removeItem("df_assets_ready_v");sessionStorage.clear();}catch(e){}
    location.replace("/?v="+Date.now());
  }).catch(function(){location.replace("/?v="+Date.now());});
}catch(e){location.replace("/");}})();
</script></body></html>
